services:
  - type: web
    name: travelproj
    runtime: node
    plan: free
    buildCommand: npm ci && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: AUTH_URL
        value: https://travelproj-s7mi.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: travelproj-db
          property: connectionString
      - key: AUTH_GOOGLE_ID
        sync: false
      - key: AUTH_GOOGLE_SECRET
        sync: false
      - key: AUTH_SECRET
        sync: false

databases:
  - name: travelproj-db
    plan: free
    databaseName: travelproj
    user: travelproj
